name: Docker ghcr.io

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lambertwong/notionnext-lbt:comments
          build-args: |
            NOTION_PAGE_ID=5ef8bcf004bd835b95f781b816aeba93
            API_BASE_URL=https://holly-resolution-227.notion.site/api/v3
            NEXT_PUBLIC_COMMENT_NOTION_ENABLE=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
